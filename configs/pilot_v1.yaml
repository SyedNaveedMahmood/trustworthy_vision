protocol: controlled_evidence_v1
status: design_only_not_run
hardware:
  gpu: "NVIDIA RTX 4080 SUPER"
  physical_vram_gb: 16
  sequential_models: true
  prefer_precision: bf16
  max_image_long_edge: 768
  batch_size: 1
  memory_headroom_gb: 1.0
models:
  qwen:
    model_id: Qwen/Qwen2.5-VL-3B-Instruct
    frozen: true
    family: qwen2_5_vl
    revision: RESOLVE_AND_PIN_AT_RUNTIME
  smol:
    model_id: HuggingFaceTB/SmolVLM2-2.2B-Instruct
    frozen: true
    family: smolvlm2
    revision: RESOLVE_AND_PIN_AT_RUNTIME
datasets:
  gqa:
    primary_task: balanced_grounded_vqa
    official_docs: https://cs.stanford.edu/people/dorarad/gqa/download.html
    reference_annotations: scene_graphs_and_question_semantic_programs
  refcocog:
    primary_task: four_choice_referring_expression_selection
    official_api: https://github.com/lichengunc/refer
    split: umd
    annotations_need_manual_access_check: true
sample_plan_per_task:
  debug: 12
  development: 40
  confirmatory: 120
  image_disjoint: true
  primary_analysis_one_item_per_image: true
seeds:
  debug: 20261
  development: 20262
  confirmatory: 20263
  bootstrap: 20264
choices:
  count: 4
  label_tokens: ["A", "B", "C", "D"]
  fixed_under_edit: true
  require_scoring_unit_tests: true
operators:
  - id: occlusion
    treatment: neutral_mean_fill
    sham: contour_only_target_preserved
  - id: blur
    treatment: strong_gaussian_blur
    sham: mild_or_boundary_blur_target_preserved
  - id: lama
    treatment: official_lama_inpaint
    sham: inpaint_then_restore_foreground
  match_offtarget_area_tolerance: 0.15
  require_semantic_operator_audit: true
  operator_removal_success_min: 0.90
  sham_preservation_min: 0.95
  offtarget_noncritical_min: 0.95
score:
  method: median_of_sham_and_offtarget_corrected_operator_effects
  lambda_default: 0.5
  lambda_dev_grid: [0, 0.25, 0.5, 1.0]
  prior_baselines: [confidence, entropy, raw_occlusion, blur_only, lama_only, mean_operator, median_operator, sham_only, offtarget_only]
  selected_comparator: DEV_SELECTION_ONLY
analysis:
  primary: within_image_positive_negative_region_pair_accuracy_difference
  macro_average_over: [task, model]
  bootstrap_cluster: image_id
  bootstrap_samples: 2000
  confidence_level: 0.95
  pilot_practical_dev_gain: 0.03
  final_ci_must_exclude_zero_for_clear_positive: true
  support_effect_claim_only_after_operator_validity_audit: true
  selectivity_coverages: [0.50, 0.70, 0.85, 0.95]
run_budget:
  total_forward_calls_max: 12000
  gpu_hours_max: 24
  max_transient_retries: 3
reports:
  honest_blocked_status: true
  protocol_lock_required_for_confirmatory: true
  make_contact_sheets: true
  raw_data_not_committed: true
